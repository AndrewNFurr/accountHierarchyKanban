<template>
    <lightning-card title="Account Hierarchy" icon-name="standard:account">
        <div class="content-container">
            <div class="accountBoard">
                <template lwc:if={dataProcessed}>
                    <template lwc:if={showKanban}>
                        <c-kanban-board
                            current-user={currentUser}
                            account-owners={ownersWithAccounts}
                            field-metadata-map={fieldMetadataMap}
                            filter-list={filterList}
                            onfilterapplied={handleFilterApplied}
                        ></c-kanban-board>
                    </template>
                </template>
            </div>
            <div class="filterBar">
                <c-filter-list
                    filter-list={filterList}
                    onfilterremoved={handleFilterRemoved}
                ></c-filter-list>
            </div>
        </div>
    </lightning-card>
    
</template>
