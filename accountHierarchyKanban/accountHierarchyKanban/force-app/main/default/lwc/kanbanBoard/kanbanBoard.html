<template>
    <lightning-card>
        <div class="filter-container">
            <div>
                <p>Filter Field</p>
                <lightning-combobox
                    name="filterField"
                    label="Filter Field"
                    value={filterField}
                    options={filterOptions}
                    onchange={handleFilterFieldChange}
                ></lightning-combobox>
            </div>
            <div>
                <p>Filter Operator</p>
                <lightning-combobox
                    name="filterOperator"
                    label="Filter Operator"
                    value={filterOperator}
                    options={filterOperatorOptions}
                    onchange={handleFilterOperatorChange}
                ></lightning-combobox>
            </div>
            <div>
                <p>Filter Value</p>
                <template lwc:if={isPicklistFilter}>
                    <lightning-combobox
                        name="filterValuePicklist"
                        label="Filter Value"
                        value={filterValue}
                        options={filterValueOptions}
                        onchange={handleFilterValueChange}
                    ></lightning-combobox>
                </template>
                <template lwc:else>
                    <lightning-input
                        type={inputType}
                        label="Filter Value"
                        value={filterValue}
                        onchange={handleFilterValueChange}
                    ></lightning-input>
                </template>
            </div>
            <lightning-button
                label="Apply Filter"
                onclick={applyFilter}
                variant="brand"
            ></lightning-button>
        </div>
        <div class='kanban-container'>
            <template for:each={accountOwners} for:item="entry">
                <div key={entry.owner.Id}
                    class="kanban-column"
                    data-owner={entry.owner.Name}>
                   
                    <h2 class='column-title'>{entry.owner.Name}</h2>

                    <template for:each={entry.accounts} for:item="account">
                        <div key={account.Id}
                            class='kanban-card'
                            onclick={handleCardClick}
                            data-id={account.Id}>
                           
                            <p class='account-title'>{account.Name}</p>
                            <p class='account-industry'>Industry: {account.Industry__c}</p>
                            <p class='account-date'>Created Date: {account.CreatedDate}</p>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
